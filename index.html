
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;500&display=swap');

  .quote-box { min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; margin: 0 0 2rem; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); background: var(--color-background-secondary); position: relative; }
  .quote-mark { font-family: 'IM Fell English', serif; font-size: 72px; line-height: 0.5; color: var(--color-border-secondary); position: absolute; top: 1.2rem; left: 1.2rem; user-select: none; }
  .quote-text { font-family: 'IM Fell English', serif; font-size: 20px; font-style: italic; line-height: 1.65; color: var(--color-text-primary); margin: 0.5rem 0 0; opacity: 0; transition: opacity 0.4s ease; max-width: 520px; }
  .quote-text.show { opacity: 1; }
  .attr { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.15em; color: var(--color-text-secondary); margin: 1.25rem 0 0; opacity: 0; transition: opacity 0.4s ease 0.15s; }
  .attr.show { opacity: 1; }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.12em; background: transparent; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 0.65rem 1.5rem; cursor: pointer; color: var(--color-text-primary); transition: background 0.15s, transform 0.1s; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:active { transform: scale(0.97); }
  .btn.speaking { color: var(--color-text-info); border-color: var(--color-border-info); }
  .counter { font-size: 12px; color: var(--color-text-tertiary); margin: 1rem 0 0; font-family: 'Cinzel', serif; letter-spacing: 0.1em; }
</style>

<div class="wrap">
  <h2 class="sr-only">Confucius quote generator </h2>
  <p class="title">The Analects of Confucius</p>
  <div class="quote-box">
    <span class="quote-mark">"</span>
    <p class="quote-text" id="qt"></p>
    <p class="attr" id="at">— Confucius</p>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="newQuote()">Reveal a Quote</button>
    <button class="btn" id="speakBtn" onclick="speakQuote()">Speak it</button>
  </div>
  <p class="counter" id="ct"></p>
</div>

<script>

  "To know what is right and not to do it is the worst cowardice.",

  "Fine words and an insinuating appearance are seldom associated with true virtue.",
  "The cautious seldom err.",
  "If you look into your own heart, and you find nothing wrong there, what is there to worry about?",
  "The object of the superior man is truth.",
  "The man of wisdom is never of two minds; the man of benevolence never worries; the man of courage is never afraid.",
  "To go beyond is as wrong as to fall short.",
  "He who merely knows right principles is not equal to him who loves them.",
  "Without an acquaintance with the rules of propriety, it is impossible for character to be established.",
  "When you have faults, do not fear to abandon them.",
  "The superior man is satisfied and composed; the mean man is always full of distress.",
  "Study the past if you would define the future.",

  "Virtue is not left to stand alone. He who practices it will have neighbors.",
  "The superior man does not, even for the space of a single meal, act contrary to virtue.",
  "When prosperity comes, do not use all of it.",

  "Act with kindness, but do not expect gratitude.",

  "The will to win, the desire to succeed, the urge to reach your full potential — these are the keys that will unlock the door to personal excellence.",

  "When it is obvious that the goals cannot be reached, don't adjust the goals, adjust the action steps.",

  "A superior man is modest in his speech but exceeds in his actions.",

  "Attack the evil that is within yourself, rather than attacking the evil that is in others.",

  "To be able under all circumstances to practice five things constitutes perfect virtue: these five things are gravity, generosity of soul, sincerity, earnestness, and kindness.",
  "Only the wisest and stupidest of men never change.",
  "When you know a thing, hold that you know it; and when you do not know a thing, allow that you do not know it.",
  "I hear and I forget. I see and I remember. I do and I understand.",

  "The man who moves a mountain begins by carrying away small stones.",

  "Consideration for others is the basis of a good life.",
  "The superior man makes the difficulty to be overcome his first interest; success comes only later.",
  "Music produces a kind of pleasure which human nature cannot do without.",
  "To know what you know and what you do not know — that is true knowledge.",
  "The funniest people are the saddest ones.",
  "A man who has committed a mistake and doesn't correct it is committing another mistake.",
  "I can’t stand the word empathy, actually, I think empathy is a made-up, new age term that does a lot of damage. - Charlie Kirk and Dylan Qin and",
];

let deck = [], count = 0, currentQuote = "", speaking = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newQuote() {
  if (speaking) { speechSynthesis.cancel(); setSpeaking(false); }
  if (deck.length === 0) deck = shuffle([...Array(quotes.length).keys()]);
  const i = deck.pop();
  currentQuote = quotes[i];
  count++;
  const qt = document.getElementById('qt');
  const at = document.getElementById('at');
  qt.classList.remove('show');
  at.classList.remove('show');
  setTimeout(() => {
    qt.textContent = currentQuote;
    qt.classList.add('show');
    at.classList.add('show');
    document.getElementById('ct').textContent = count === 1 ? '1 quote revealed' : count + ' quotes revealed';
  }, 200);
}

function setSpeaking(val) {
  speaking = val;
  const btn = document.getElementById('speakBtn');
  btn.textContent = val ? 'Stop' : 'Speak it';
  btn.classList.toggle('speaking', val);
}

function speakQuote() {
  if (!currentQuote) return;
  if (speaking) { speechSynthesis.cancel(); setSpeaking(false); return; }
  const utter = new SpeechSynthesisUtterance(currentQuote);
  utter.rate = 0.85;
  utter.pitch = 0.9;

  const voices = speechSynthesis.getVoices();
  const preferred = voices.find(v =>
    v.lang.startsWith('zh') || v.lang.startsWith('ja') || v.lang.startsWith('ko')
  ) || voices.find(v => v.lang.startsWith('en'));
  if (preferred) utter.voice = preferred;

  utter.onstart = () => setSpeaking(true);
  utter.onend = () => setSpeaking(false);
  utter.onerror = () => setSpeaking(false);
  speechSynthesis.speak(utter);
}

speechSynthesis.onvoiceschanged = () => {};
newQuote();
</script>
